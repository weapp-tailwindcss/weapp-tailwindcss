packages:
  - packages/*
  - packages-runtime/*
  - packages-native/*
  - apps/*
  - website
  - benchmark/*
  - tools/*
  - e2e
  - examples/*
  - starter/*
  - '!tailwindcss-weapp'
  - '!**/test/**'
  - demo/*
  - demo/web/*

allowBuilds:
  lefthook: false
  '@dcloudio/hbuilderx-cli': false
  '@parcel/watcher': false
  '@swc/core': false
  '@tarojs/binding': false
  '@tarojs/cli': false
  '@tailwindcss/oxide': true
  core-js: false
  core-js-pure: false
  esbuild: true
  '@nutui/nutui-react-taro': false
  msgpackr-extract: false
  sharp: true
  taro-hooks: false
  unrs-resolver: false
  vue-demi: false
  workerd: true

pmOnFail: warn
minimumReleaseAge: 0
minimumReleaseAgeExclude:
  - prettier@3.9.3

update:
  ignoreDeps:
    # Taro 4.3.1 仍依赖 Babel 7，需与 Taro 成组迁移。
    - '@babel/*'
    - 'babel-*'
    - '@tarojs/*'
    - eslint-config-taro
    # DCloud 与 Mpx 依赖各自框架工具链，禁止跨主版本自动升级。
    - '@dcloudio/*'
    - '@mpxjs/*'
    # Taro RN runner 固定 Expo 50、React 18 与 React Native 0.73。
    - '@expo/*'
    - expo
    - '@react-native/*'
    - '@react-native-community/*'
    - '@react-native-picker/*'
    - '@rnx-kit/*'
    - react-native
    - 'react-native-*'
    - 'metro*'
    - react
    - react-dom
    - react-refresh
    - '@types/react'
    - '@types/react-dom'
    # Taro runner 当前分别约束 Vite 4 与 Webpack 5.91.0。
    - vite
    - '@vitejs/plugin-*'
    - 'vite-plugin-*'
    # 根 workspace 用 npm alias 保留多代 Vite，也必须按 alias 名冻结。
    - vite4
    - vite5
    - vite6
    - vite7
    - vite8
    - rollup
    - webpack
    - webpack-dev-server
    # TypeScript、Vue 与组件库需要按框架兼容矩阵成组验证。
    - typescript
    - typescript-eslint
    - '@typescript-eslint/*'
    - vue
    - '@vue/*'
    - vue-i18n
    - vue-router
    - vue-tsc
    - pinia
    - '@nutui/*'
    # 工具链主版本与类型包需在独立迁移任务中验证 Node 和运行时兼容性。
    - c12
    - cac
    - execa
    - jsdom
    - '@types/jsdom'
    - pako
    - '@types/pako'
    - '@types/gulp-replace'
    - gulp-util
    - unplugin-vue-router

versioning:
  fixed:
    - [weapp-tailwindcss, '@weapp-tailwindcss/cli', '@weapp-tailwindcss/native-darwin-arm64', '@weapp-tailwindcss/native-darwin-x64', '@weapp-tailwindcss/native-linux-arm64-gnu', '@weapp-tailwindcss/native-linux-x64-gnu', '@weapp-tailwindcss/native-linux-arm64-musl', '@weapp-tailwindcss/native-linux-x64-musl', '@weapp-tailwindcss/native-win32-arm64-msvc', '@weapp-tailwindcss/native-win32-x64-msvc']
  changelog:
    storage: repository

overrides:
  jiti: 2.7.0
  '@docusaurus/bundler>postcss': 8.5.32
  '@docusaurus/cssnano-preset>postcss': 8.5.32
  '@docusaurus/theme-classic>postcss': 8.5.32
  weapp-vite>weapp-tailwindcss: workspace:*
  eslint-config-taro@4.3.1>@typescript-eslint/parser: 8.72.1
  eslint-config-taro@4.3.1>@typescript-eslint/eslint-plugin: 8.72.1
  # Taro RN 规则使用在新版本中已删除的 Stylelint 私有接口，保持上游实测配套。
  '@tarojs/rn-style-transformer@4.3.1>stylelint': 16.10.0
  # devframe 与 agentic 使用双向精确 peer，各工具链保留自己的配套版本。
  '@eslint/config-inspector@3.5.0>devframe': 1.2.6
  '@eslint/config-inspector@3.5.0>@devframes/agentic': 1.2.6
  weapp-vite@7.6.0>@modelcontextprotocol/server: 2.4.0
  '@weapp-vite/mcp@2.1.0>@modelcontextprotocol/server': 2.4.0

