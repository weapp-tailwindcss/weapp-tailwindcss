name: Architecture
on:
  pull_request:
  push:
    branches: [main, next]
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
jobs:
  architecture:
    name: Architecture Contract
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm architecture:check
      - run: pnpm --filter weapp-tailwindcss exec vitest run test/ci/architecture-graph.test.ts test/ci/generation-ownership.test.ts --update=none
        env:
          CI: '1'
