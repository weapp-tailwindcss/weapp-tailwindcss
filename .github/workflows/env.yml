name: Environment Package

on:
  workflow_call:
  workflow_dispatch:
  push:
    branches: [main, next]
    paths:
      - packages/env/**
      - packages/weapp-tailwindcss/src/framework/**
      - packages/weapp-tailwindcss/test/ci/env-workflow.test.ts
      - packages/weapp-tailwindcss/test/ci/ensure-built-env.test.ts
      - scripts/ensure-weapp-tailwindcss-built.mjs
      - scripts/pnpm-command.mjs
      - scripts/verify-packed-packages.mjs
      - package.json
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - .github/actions/setup-pnpm/**
      - .github/workflows/env.yml
      - .github/workflows/pr-gate.yml

permissions:
  contents: read

env:
  CI: '1'

jobs:
  scope:
    uses: ./.github/workflows/ci-scope.yml

  portability:
    needs: scope
    if: needs.scope.outputs.core == 'true'
    name: Environment package (${{ matrix.os }}, Node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [22, 24]
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup-pnpm
        with:
          node-version: ${{ matrix.node }}
      - name: Build environment and main package dependency closure
        run: pnpm --filter weapp-tailwindcss... run build
      - name: Check environment types
        run: pnpm --filter @weapp-tailwindcss/env typecheck
      - name: Run environment regressions
        run: pnpm --filter @weapp-tailwindcss/env test --update=none
      - name: Verify public and legacy tarball consumers
        run: pnpm --filter @weapp-tailwindcss/env test:package
