name: Benchmark Linux Allocation Diagnostic

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  allocation-diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
      - name: 保存本轮专用观察器
        run: |
          mkdir -p "$RUNNER_TEMP/mpx-diagnostic"
          cp benchmark/version-compare/diagnostic/allocation-preload.cjs "$RUNNER_TEMP/mpx-diagnostic/allocation-preload.cjs"
          sha256sum "$RUNNER_TEMP/mpx-diagnostic/allocation-preload.cjs" > "$RUNNER_TEMP/mpx-diagnostic/preload.sha256"
          git rev-parse HEAD > "$RUNNER_TEMP/mpx-diagnostic/controller.sha"
      - name: 基线安装与构建
        run: |
          git checkout --detach e976c47772afcdaea3cbe674c84b5146f7d6edc7
          pnpm install --frozen-lockfile
          pnpm build:pkgs
      - name: 基线一次 Mpx 构建分配诊断
        env:
          WEAPP_TW_HMR_TIMING: '1'
          WEAPP_TW_HMR_MEMORY_DEBUG: '1'
        run: |
          git rev-parse HEAD > "$RUNNER_TEMP/mpx-diagnostic/base.sha"
          MPX_ALLOCATION_OUTPUT="$RUNNER_TEMP/mpx-diagnostic/base" NODE_OPTIONS="--require=$RUNNER_TEMP/mpx-diagnostic/allocation-preload.cjs" pnpm --dir demo/mpx-tailwindcss-v4 build
          cp -R demo/mpx-tailwindcss-v4/dist "$RUNNER_TEMP/mpx-diagnostic/base-output"
      - name: 当前准确 head 安装与构建
        run: |
          git checkout --detach 2862a60f6d5618fa68f1f504ebca04fedf575089
          pnpm install --frozen-lockfile
          pnpm build:pkgs
      - name: 当前一次 Mpx 构建分配诊断
        env:
          WEAPP_TW_HMR_TIMING: '1'
          WEAPP_TW_HMR_MEMORY_DEBUG: '1'
        run: |
          git rev-parse HEAD > "$RUNNER_TEMP/mpx-diagnostic/current.sha"
          MPX_ALLOCATION_OUTPUT="$RUNNER_TEMP/mpx-diagnostic/current" NODE_OPTIONS="--require=$RUNNER_TEMP/mpx-diagnostic/allocation-preload.cjs" pnpm --dir demo/mpx-tailwindcss-v4 build
          cp -R demo/mpx-tailwindcss-v4/dist "$RUNNER_TEMP/mpx-diagnostic/current-output"
      - name: 上传诊断证据，不作为门禁样本
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: mpx-linux-allocation-diagnostic
          path: ${{ runner.temp }}/mpx-diagnostic/**
          if-no-files-found: error
