name: Taro Webpack exact source diagnostic

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: taro-webpack-source-ab-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  source-diagnostic:
    name: Diagnostic / Taro exact 2dd 0637 source and output
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      NODE_OPTIONS: ''
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          node-version: 22.23.4
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install isolated observation tooling
        run: pnpm install --frozen-lockfile --ignore-scripts --filter weapp-tailwindcss-monorepo
      - name: Verify exact source instrumentation
        run: node --test benchmark/version-compare/scripts/diagnostics/source-ab/test.mjs
      - name: Observe exact source candidates tasks and complete assets
        run: node benchmark/version-compare/scripts/diagnostics/source-ab/run.mjs --out-dir .tmp/taro-source-ab
      - name: Preserve diagnostic evidence and first failure
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: taro-webpack-source-ab-${{ github.run_id }}-${{ github.run_attempt }}
          path: .tmp/taro-source-ab/**
          if-no-files-found: error
          retention-days: 14
