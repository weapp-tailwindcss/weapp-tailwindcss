name: Release Gate

on:
  pull_request:
    types: [opened, synchronize]
    paths:
      - package.json
      - pnpm-lock.yaml
      - repoctl.config.ts
      - packages/*/package.json
      - packages-runtime/*/package.json
      - packages-native/**
      - packages/weapp-tailwindcss/**
      - packages/postcss/**
      - pnpm-workspace.yaml
      - .github/workflows/native.yml
      - .github/workflows/release.yml
      - scripts/verify-packed-packages.mjs
      - scripts/release-certificate.ts
      - .github/workflows/release-gate.yml
  workflow_dispatch:

concurrency:
  group: release-gate-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  native-artifacts:
    uses: ./.github/workflows/native.yml

  release-gate:
    name: Release Gate (ubuntu-latest, 24)
    runs-on: ubuntu-latest
    needs: native-artifacts
    timeout-minutes: 30
    env:
      HUSKY: 0
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v6

      - uses: pnpm/action-setup@v4

      - name: Setup Node.js environment
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Download native artifacts from this run
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: native-*
          merge-multiple: true
          path: packages

      - name: Stage and verify all native platform packages
        run: pnpm native:artifacts:stage

      - name: Build release artifacts
        run: pnpm build

      - name: Verify release artifacts
        run: pnpm release:verify
