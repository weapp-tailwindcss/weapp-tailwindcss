name: Release Gate

on:
  pull_request:
    types: [opened, synchronize]
    paths:
      - package.json
      - pnpm-lock.yaml
      - repoctl.config.ts
      - packages/*/package.json
      - packages-runtime/*/package.json
      - packages-native/**
      - packages/weapp-tailwindcss/**
      - packages/postcss/**
      - packages/css-compat/**
      - pnpm-workspace.yaml
      - .github/workflows/native.yml
      - .github/workflows/release.yml
      - scripts/verify-packed-packages.mjs
      - scripts/release-certificate.ts
      - .github/workflows/release-gate.yml
      - .github/workflows/ci-scope.yml
      - scripts/ci/**
      - tools/ci-scope/**
  workflow_dispatch:
  workflow_call:

concurrency:
  group: release-gate-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  scope:
    uses: ./.github/workflows/ci-scope.yml

  native-artifacts:
    needs: scope
    if: needs.scope.outputs.core == 'true'
    uses: ./.github/workflows/native.yml

  release-gate:
    name: Release Gate (ubuntu-latest, 24)
    runs-on: ubuntu-latest
    needs: [scope, native-artifacts]
    if: always() && !cancelled()
    timeout-minutes: 30
    env:
      HUSKY: 0
    steps:
      - name: Require scope and enabled native checks
        env:
          SCOPE_RESULT: ${{ needs.scope.result }}
          CORE_ENABLED: ${{ needs.scope.outputs.core }}
          NATIVE_RESULT: ${{ needs.native-artifacts.result }}
        run: |
          test "$SCOPE_RESULT" = success
          test "$CORE_ENABLED" = true || test "$CORE_ENABLED" = false
          if test "$CORE_ENABLED" = true; then
            test "$NATIVE_RESULT" = success
          fi
      - name: Checkout Repo
        if: needs.scope.outputs.core == 'true'
        uses: actions/checkout@v6

      - uses: pnpm/action-setup@v4
        if: needs.scope.outputs.core == 'true'

      - name: Setup Node.js environment
        if: needs.scope.outputs.core == 'true'
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install Dependencies
        if: needs.scope.outputs.core == 'true'
        run: pnpm install --frozen-lockfile

      - name: Download native artifacts from this run
        if: needs.scope.outputs.core == 'true'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: native-*
          merge-multiple: true
          path: packages

      - name: Stage and verify all native platform packages
        if: needs.scope.outputs.core == 'true'
        run: pnpm native:artifacts:stage

      - name: Build release artifacts
        if: needs.scope.outputs.core == 'true'
        run: pnpm build

      - name: Verify release artifacts
        if: needs.scope.outputs.core == 'true'
        run: pnpm release:verify
