name: Website SEO Quality

on:
  pull_request:
  push:
    branches:
      - main
    paths:
      - .github/workflows/website-seo-quality.yml
      - 'website/**'
  workflow_dispatch:

concurrency:
  group: website-seo-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  detect-website-changes:
    name: Detect website changes
    uses: ./.github/workflows/ci-scope.yml

  seo-quality:
    name: SEO Quality Gate
    needs: detect-website-changes
    if: always() && !cancelled()
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Require change detection
        if: needs.detect-website-changes.result != 'success'
        run: |
          echo "::error::website change detection failed."
          exit 1

      - name: Require website scope output
        env:
          WEBSITE_ENABLED: ${{ needs.detect-website-changes.outputs.website }}
        run: test "$WEBSITE_ENABLED" = true || test "$WEBSITE_ENABLED" = false

      - name: Skip when website is unchanged
        if: needs.detect-website-changes.outputs.website != 'true'
        run: echo "No website changes detected; SEO checks are not required for this change."

      - name: Check out code
        if: needs.detect-website-changes.outputs.website == 'true'
        uses: actions/checkout@v6

      - uses: pnpm/action-setup@v4
        if: needs.detect-website-changes.outputs.website == 'true'

      - name: Setup Node.js environment
        if: needs.detect-website-changes.outputs.website == 'true'
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        if: needs.detect-website-changes.outputs.website == 'true'
        run: pnpm install --frozen-lockfile

      - name: Docs audience gate (website)
        if: needs.detect-website-changes.outputs.website == 'true'
        run: pnpm --filter @weapp-tailwindcss/website check:docs-audience

      - name: Test deployment guards
        if: needs.detect-website-changes.outputs.website == 'true'
        run: pnpm --filter @weapp-tailwindcss/website exec vitest run scripts/docs-deployment.test.ts scripts/deploy-docs-cloudflare.test.mjs --update=none

      - name: few_keywords Gate (website)
        if: needs.detect-website-changes.outputs.website == 'true'
        run: pnpm --filter @weapp-tailwindcss/website seo:few-keywords

      - name: SEO Quality Gate (website)
        if: needs.detect-website-changes.outputs.website == 'true'
        run: pnpm --filter @weapp-tailwindcss/website seo:quality:strict

      - name: Build website
        if: needs.detect-website-changes.outputs.website == 'true'
        run: pnpm --filter @weapp-tailwindcss/website build

      - name: Verify Worker routing locally
        if: needs.detect-website-changes.outputs.website == 'true'
        run: pnpm --filter @weapp-tailwindcss/website test:worker

      - name: Validate Worker bundle
        if: needs.detect-website-changes.outputs.website == 'true'
        run: pnpm --filter @weapp-tailwindcss/website deploy:worker:dry-run

      - name: SEO Status Note
        if: always()
        run: |
          {
            echo "## Website SEO Quality"
            echo "- 本工作流独立执行 website SEO 严格门禁。"
            echo "- website 变更先执行 \`seo:few-keywords\`，提前拦截 keywords 数量不足。"
            echo "- 当前执行命令：\`pnpm --filter @weapp-tailwindcss/website seo:quality:strict\`。"
            echo "- 触发条件：PR、主分支推送命中 website 目录变更，或手动触发。"
          } >> "$GITHUB_STEP_SUMMARY"
