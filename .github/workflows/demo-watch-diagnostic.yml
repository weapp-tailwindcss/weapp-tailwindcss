name: Demo Watch Diagnostic

on:
  pull_request:
    paths:
      - .github/workflows/demo-watch-diagnostic.yml
      - packages/weapp-tailwindcss/src/bundlers/webpack/**
      - demo/subpackage-taro-webpack-react-tailwindcss-v4/**
      - scripts/ci/demo-matrix/**
  workflow_dispatch:
    inputs:
      mpx:
        description: 仅诊断 Mpx 微信与支付宝的监听生命周期
        type: boolean
        default: false

concurrency:
  group: windows-watch-diagnostic-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  output-copy:
    if: inputs.mpx
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - run: node scripts/ci/demo-matrix/fixtures/output-copy-race.cjs
  watch:
    name: Repeated watch (${{ matrix.os || 'windows-latest' }}, Node ${{ matrix.node || 24 }}, ${{ matrix.case }})
    runs-on: ${{ matrix.os || 'windows-latest' }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(inputs.mpx && '[{"case":"mpx-tailwindcss-v4:wx","os":"windows-latest","node":22},{"case":"mpx-tailwindcss-v4:wx","os":"windows-latest","node":24},{"case":"mpx-tailwindcss-v4:ali","os":"windows-latest","node":22},{"case":"mpx-tailwindcss-v4:ali","os":"windows-latest","node":24}]' || '[{"case":"subpackage-taro-webpack-react-tailwindcss-v4:h5"},{"case":"taro-webpack-vue3-tailwindcss-v4:weapp"},{"case":"taro-vite-vue3-tailwindcss-v4:jd"},{"case":"taro-vite-vue3-tailwindcss-v4:h5"},{"case":"subpackage-taro-webpack-react-tailwindcss-v4:tt"},{"case":"gulp-tailwindcss-v4:tt"},{"case":"mpx-tailwindcss-v4:wx","os":"windows-latest","node":22},{"case":"mpx-tailwindcss-v4:wx","os":"windows-latest","node":24},{"case":"uni-app-vite-tailwindcss-v4:mp-weixin","os":"ubuntu-latest"}]') }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: ./.github/actions/setup-pnpm
        with:
          node-version: ${{ matrix.node || 24 }}
      - run: pnpm build:ci
      - run: pnpm exec playwright install chromium
      - if: inputs.mpx
        run: node scripts/ci/demo-matrix/fixtures/mpx-fatal-watch.cjs recoverable
      - run: pnpm test:demo:matrix
        env:
          CI: '1'
      - name: Repeat full production and live update acceptance
        shell: bash
        env:
          CI: '1'
          DEBUG: weapp-tw
          NODE_OPTIONS: --max-old-space-size=6144
          DEMO_CASE: ${{ matrix.case }}
          DEMO_MATRIX_PROCESS_DIAGNOSTICS: '1'
          DEMO_MATRIX_WATCH_DIAGNOSTICS: ${{ startsWith(matrix.case, 'mpx-') && '1' || '0' }}
        run: |
          export NODE_OPTIONS="$NODE_OPTIONS --trace-exit --trace-uncaught --require=$GITHUB_WORKSPACE/scripts/ci/demo-matrix/process-diagnostic.cjs"
          if [[ "$DEMO_CASE" == mpx-* ]]; then
            unset DEBUG
          fi
          if [[ "$DEMO_CASE" == *vite* || "$DEMO_CASE" == gulp-* ]]; then
            export NODE_OPTIONS="$NODE_OPTIONS --require=$GITHUB_WORKSPACE/scripts/ci/demo-matrix/native-watch-diagnostic.cjs"
          fi
          if [[ "$DEMO_CASE" == *webpack* ]]; then
            export NODE_OPTIONS="$NODE_OPTIONS --require=$GITHUB_WORKSPACE/scripts/ci/demo-matrix/watch-diagnostic.cjs"
          fi
          if [[ "${{ inputs.mpx }}" == true ]]; then
            export DEMO_MATRIX_CASES='["mpx-tailwindcss-v4:wx","mpx-tailwindcss-v4:ali","mpx-tailwindcss-v4:swan","mpx-tailwindcss-v4:tt"]'
          fi
          for attempt in 1 2 3; do
            DEMO_MATRIX_ARTIFACT_DIR="e2e/.artifacts/watch-diagnostic/$attempt" pnpm e2e:demo:matrix "$DEMO_CASE" || exit 1
          done
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: windows-watch-diagnostic-${{ strategy.job-index }}
          path: e2e/.artifacts/watch-diagnostic/**
          if-no-files-found: error
          retention-days: 14
