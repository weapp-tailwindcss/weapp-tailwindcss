name: Native Compiler Artifacts

on:
  workflow_call:
    inputs:
      ref:
        description: 已校验的构建提交
        type: string
        required: false
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native:
    name: Native (${{ matrix.suffix }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        include:
          - runner: macos-latest
            target: aarch64-apple-darwin
            suffix: darwin-arm64
          - runner: macos-15-intel
            target: x86_64-apple-darwin
            suffix: darwin-x64
          - runner: windows-latest
            target: x86_64-pc-windows-msvc
            suffix: win32-x64-msvc
          - runner: windows-11-arm
            target: aarch64-pc-windows-msvc
            suffix: win32-arm64-msvc
          - runner: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            suffix: linux-x64-gnu
            image: quay.io/pypa/manylinux_2_28_x86_64
            arch: x64
            libc: gnu
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            suffix: linux-arm64-gnu
            image: quay.io/pypa/manylinux_2_28_aarch64
            arch: arm64
            libc: gnu
          - runner: ubuntu-latest
            target: x86_64-unknown-linux-musl
            suffix: linux-x64-musl
            image: node:24-alpine
            arch: x64
            libc: musl
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
            suffix: linux-arm64-musl
            image: node:24-alpine
            arch: arm64
            libc: musl
    env:
      HUSKY: 0
      CI: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        if: matrix.image == ''

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        id: node
        with:
          node-version: 24
          cache: ${{ matrix.image == '' && 'pnpm' || '' }}

      - name: Cache host Cargo downloads
        if: matrix.image == ''
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: native-cargo-${{ matrix.suffix }}-1.96.0-${{ hashFiles('packages/weapp-tailwindcss/native/Cargo.lock', 'packages/postcss/native/Cargo.lock') }}
          restore-keys: native-cargo-${{ matrix.suffix }}-1.96.0-

      - name: Cache Linux container pnpm store
        if: matrix.image != ''
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ${{ runner.temp }}/native-ci/pnpm
          key: native-pnpm-${{ matrix.suffix }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: native-pnpm-${{ matrix.suffix }}-

      - name: Cache Linux container Cargo downloads
        if: matrix.image != ''
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            ${{ runner.temp }}/native-ci/cargo/registry
            ${{ runner.temp }}/native-ci/cargo/git
          key: native-cargo-${{ matrix.suffix }}-1.96.0-${{ hashFiles('packages/weapp-tailwindcss/native/Cargo.lock', 'packages/postcss/native/Cargo.lock') }}
          restore-keys: native-cargo-${{ matrix.suffix }}-1.96.0-

      - name: Prepare Linux container cache directories
        if: matrix.image != ''
        run: mkdir -p "$RUNNER_TEMP/native-ci/pnpm" "$RUNNER_TEMP/native-ci/cargo"

      - name: Install dependencies
        if: matrix.image == ''
        run: pnpm install --frozen-lockfile

      - name: Install pinned Rust toolchain
        if: matrix.image == ''
        run: |
          rustup toolchain install 1.96.0 --profile minimal --component clippy
          rustup default 1.96.0
          rustup target add ${{ matrix.target }}

      - name: Build, lint and verify native consumers
        if: matrix.image == ''
        run: node packages/weapp-tailwindcss/native/ci.mjs --target=${{ matrix.target }}

      - name: Build and verify in the target Linux libc
        if: matrix.image != ''
        env:
          NATIVE_NODE_VERSION: ${{ steps.node.outputs.node-version }}
          NATIVE_TARGET: ${{ matrix.target }}
          NATIVE_ARCH: ${{ matrix.arch }}
          NATIVE_LIBC: ${{ matrix.libc }}
          NATIVE_IMAGE: ${{ matrix.image }}
        run: >-
          docker run --rm -v "$PWD:/work" -w /work
          -v "$RUNNER_TEMP/native-ci:/native-ci"
          -e NATIVE_PNPM_STORE=/native-ci/pnpm -e CARGO_HOME=/native-ci/cargo
          -e GITHUB_RUN_ID -e GITHUB_RUN_ATTEMPT -e GITHUB_JOB
          -e CI=1 -e HUSKY=0 -e NATIVE_NODE_VERSION -e NATIVE_TARGET -e NATIVE_ARCH -e NATIVE_LIBC
          "$NATIVE_IMAGE" sh packages/weapp-tailwindcss/native/ci-linux.sh

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        if: matrix.image == ''
        with:
          node-version: 22.18.0

      - name: Verify minimum supported Node ABI
        if: matrix.image == ''
        run: node packages/weapp-tailwindcss/native/ci.mjs --target=${{ matrix.target }} --verify-only

      - name: Verify minimum Node ABI in the target Linux libc
        if: matrix.image != ''
        env:
          NATIVE_NODE_VERSION: v22.18.0
          NATIVE_TARGET: ${{ matrix.target }}
          NATIVE_ARCH: ${{ matrix.arch }}
          NATIVE_LIBC: ${{ matrix.libc }}
          NATIVE_IMAGE: ${{ matrix.libc == 'musl' && 'node:22.18.0-alpine' || matrix.image }}
        run: >-
          docker run --rm -v "$PWD:/work" -w /work
          -v "$RUNNER_TEMP/native-ci:/native-ci"
          -e NATIVE_PNPM_STORE=/native-ci/pnpm -e NATIVE_REUSE_DEPENDENCIES=1
          -e GITHUB_RUN_ID -e GITHUB_RUN_ATTEMPT -e GITHUB_JOB
          -e CI=1 -e HUSKY=0 -e NATIVE_VERIFY_ONLY=1 -e NATIVE_NODE_VERSION -e NATIVE_TARGET -e NATIVE_ARCH -e NATIVE_LIBC
          "$NATIVE_IMAGE" sh packages/weapp-tailwindcss/native/ci-linux.sh

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        if: matrix.image == ''
        with:
          node-version: 20.19.0

      - name: Verify independent PostCSS minimum Node ABI
        if: matrix.image == ''
        run: node --import tsx packages/weapp-tailwindcss/native/test/package.mjs --css-only

      - name: Verify independent PostCSS minimum Node ABI in Linux
        if: matrix.image != ''
        env:
          NATIVE_NODE_VERSION: v20.19.0
          NATIVE_TARGET: ${{ matrix.target }}
          NATIVE_ARCH: ${{ matrix.arch }}
          NATIVE_LIBC: ${{ matrix.libc }}
          NATIVE_IMAGE: ${{ matrix.libc == 'musl' && 'node:20.19.0-alpine' || matrix.image }}
        run: >-
          docker run --rm -v "$PWD:/work" -w /work
          -v "$RUNNER_TEMP/native-ci:/native-ci"
          -e NATIVE_PNPM_STORE=/native-ci/pnpm -e NATIVE_REUSE_DEPENDENCIES=1
          -e GITHUB_RUN_ID -e GITHUB_RUN_ATTEMPT -e GITHUB_JOB
          -e CI=1 -e HUSKY=0 -e NATIVE_CSS_ONLY=1 -e NATIVE_NODE_VERSION -e NATIVE_TARGET -e NATIVE_ARCH -e NATIVE_LIBC
          "$NATIVE_IMAGE" sh packages/weapp-tailwindcss/native/ci-linux.sh

      - name: Upload verified native artifacts
        uses: actions/upload-artifact@v7
        with:
          name: native-${{ matrix.suffix }}
          path: |
            packages/weapp-tailwindcss/native/bindings/*
            packages/postcss/native/bindings/*
          if-no-files-found: error
          retention-days: 7
