name: Agent Workflow Contract

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call:
    inputs:
      full_verification:
        description: 审批后完整执行版本 PR 验收，默认保留自动范围
        type: boolean
        required: false
        default: false

permissions:
  contents: read

jobs:
  scope:
    uses: ./.github/workflows/ci-scope.yml
    with:
      full_verification: ${{ inputs.full_verification || false }}

  agents:
    needs: scope
    if: github.event_name != 'pull_request' || needs.scope.outputs.metadata_only != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.full_verification && github.event.pull_request.head.sha || github.sha }}
      - uses: ./.github/actions/setup-pnpm
      - run: pnpm agents:test
      - run: pnpm agents:check

  agents-gate:
    name: ${{ github.event_name == 'pull_request' && needs.scope.outputs.metadata_only == 'true' && 'Await manual version verification' || 'Agent Workflow Gate' }}
    needs: [scope, agents]
    if: always() && !cancelled()
    runs-on: ubuntu-latest
    steps:
      - name: Require scope and enabled agent workflow verification
        env:
          SCOPE_RESULT: ${{ needs.scope.result }}
          METADATA_ONLY: ${{ needs.scope.outputs.metadata_only }}
          EVENT_NAME: ${{ github.event_name }}
          VERIFICATION_RESULT: ${{ needs.agents.result }}
        run: |
          test "$SCOPE_RESULT" = success
          test "$METADATA_ONLY" = true || test "$METADATA_ONLY" = false
          if test "$EVENT_NAME" != pull_request || test "$METADATA_ONLY" != true; then
            test "$VERIFICATION_RESULT" = success
          fi
