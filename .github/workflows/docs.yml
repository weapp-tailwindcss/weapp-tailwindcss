name: Deploy Docs Worker

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-worker-production
  cancel-in-progress: false

jobs:
  deploy-production:
    name: Build, validate and deploy production
    if: github.repository == 'weapp-tailwindcss/weapp-tailwindcss' && github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SITE_URL: https://tw.weapp.dev

    steps:
      - name: Check out code
        uses: actions/checkout@v6

      - uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Test deployment guards
        run: pnpm --filter @weapp-tailwindcss/website exec vitest run scripts/docs-deployment.test.ts scripts/deploy-docs-cloudflare.test.mjs --update=none

      - name: Check docs audience
        run: pnpm --filter @weapp-tailwindcss/website check:docs-audience

      - name: Run few_keywords gate
        run: pnpm --filter @weapp-tailwindcss/website seo:few-keywords

      - name: Build website
        run: pnpm --filter @weapp-tailwindcss/website build

      - name: Run SEO/GEO quality gate
        run: pnpm --filter @weapp-tailwindcss/website seo:quality:strict

      - name: Verify Worker routing locally
        run: pnpm --filter @weapp-tailwindcss/website test:worker

      - name: Validate Worker bundle
        run: pnpm --filter @weapp-tailwindcss/website deploy:worker:dry-run

      - name: Require latest main before deployment
        id: latest
        run: pnpm exec tsx scripts/deploy-docs-gate.ts

      - name: Deploy production Worker
        id: deploy
        if: steps.latest.outputs.deploy == 'true'
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          pnpm exec tsx scripts/deploy-docs-gate.ts --credentials
          pnpm --filter @weapp-tailwindcss/website exec wrangler deployments list --config wrangler.jsonc --env=""
          pnpm deploy:docs:worker

      - name: Verify deployed production assets
        if: steps.deploy.outcome == 'success'
        run: pnpm --filter @weapp-tailwindcss/website verify:deployment -- https://tw.weapp.dev

      - name: Record deployment result
        if: always()
        env:
          DEPLOY_OUTCOME: ${{ steps.deploy.outcome }}
        run: |
          {
            echo '## Production documentation'
            echo "- Commit: $GITHUB_SHA"
            echo "- Upload: $DEPLOY_OUTCOME"
            echo '- Site: https://tw.weapp.dev'
            echo '- Worker versions before and after upload are recorded in the deployment step log.'
            echo '- The job succeeds only after deployed assets pass verification.'
          } >> "$GITHUB_STEP_SUMMARY"
