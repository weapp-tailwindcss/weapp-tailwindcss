# repoctl-managed: release/v2
name: Release

on:
  push:
    branches: [main]
  pull_request_target:
    types: [closed]
    branches: [main]
  workflow_dispatch:
    inputs:
      mode:
        description: Release operation (auto 仅用于预发布分支)
        required: true
        default: prepare
        type: choice
        options:
          - auto
          - prepare
          - publish
          - publish-unpublished
      package:
        description: Package used for unpublished-version recovery
        required: false
        type: string
      version:
        description: Version used for unpublished-version recovery
        required: false
        type: string
      oidc_audit:
        description: 仅核验全部公开包的 npm OIDC 凭据交换
        required: false
        default: false
        type: boolean

env:
  HUSKY: 0
  NPM_CONFIG_PROVENANCE: true
  npm_config_registry: https://registry.npmjs.org

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ !inputs.oidc_audit && (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.mode == 'prepare')) && 'prepare' || 'publish' }}-refs/heads/${{ github.event.pull_request.base.ref || github.ref_name }}${{ inputs.oidc_audit && '-oidc-audit' || '' }}${{ github.event_name == 'pull_request_target' && !(github.event.pull_request.merged == true && github.event.pull_request.base.ref == 'main' && github.event.pull_request.head.ref == 'release/pnpm-version' && github.event.pull_request.base.repo.full_name == github.repository && github.event.pull_request.head.repo.full_name == github.repository) && format('-ignored-{0}', github.run_id) || '' }}${{ github.event_name == 'workflow_dispatch' && !inputs.oidc_audit && ((github.ref_name == 'main' && inputs.mode == 'auto') || (github.ref_name != 'main' && inputs.mode == 'prepare')) && format('-ignored-{0}', github.run_id) || '' }}
  cancel-in-progress: ${{ !inputs.oidc_audit && (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.mode == 'prepare')) }}

jobs:
  plan:
    name: Route release work
    if: >-
      ${{ !inputs.oidc_audit && ((github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request_target' && github.event.pull_request.merged == true &&
      github.event.pull_request.base.ref == 'main' && github.event.pull_request.head.ref == 'release/pnpm-version' &&
      github.event.pull_request.base.repo.full_name == github.repository &&
      github.event.pull_request.head.repo.full_name == github.repository)) }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      REPO_RELEASE_MODE: ${{ inputs.mode || 'prepare' }}
      REPO_RELEASE_PACKAGE: ${{ inputs.package }}
      REPO_RELEASE_VERSION: ${{ inputs.version }}
    outputs:
      run: ${{ steps.plan.outputs.run }}
      ref: ${{ steps.route.outputs.ref }}
      mode: ${{ steps.route.outputs.mode }}
      branch: ${{ steps.route.outputs.branch }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha || github.event.after || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Validate release event
        id: route
        run: node scripts/ci/release-route.mjs --github-output "$GITHUB_OUTPUT"
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # 此处只消费路由结果；正式 job 在自身 checkout 重新规划和验证。
      - name: Plan release route
        id: plan
        env:
          GITHUB_TOKEN: ${{ github.token }}
          CI_RELEASE_SOURCE_SHA: ${{ steps.route.outputs.ref }}
          CI_RELEASE_BRANCH: ${{ steps.route.outputs.branch }}
          REPO_RELEASE_MODE: ${{ steps.route.outputs.mode }}
        if: steps.route.outputs.run == 'true'
        run: node scripts/ci/auto-prepare-plan.mjs

  native-artifacts:
    needs: plan
    if: needs.plan.outputs.run == 'true'
    uses: ./.github/workflows/native.yml
    with:
      ref: ${{ needs.plan.outputs.ref }}

  release:
    name: Release
    runs-on: ubuntu-latest
    needs: [plan, native-artifacts]
    if: ${{ !cancelled() && needs.plan.result == 'success' && needs.plan.outputs.run == 'true' && needs.native-artifacts.result == 'success' }}
    timeout-minutes: 45
    permissions:
      actions: read
      contents: write
      pull-requests: write
      id-token: write
    env:
      GITHUB_TOKEN: ${{ secrets.REPOCTL_RELEASE_TOKEN || secrets.CHANGESETS_RELEASE_TOKEN || github.token }}
      CI_RELEASE_SOURCE_SHA: ${{ needs.plan.outputs.ref }}
      CI_RELEASE_BRANCH: ${{ needs.plan.outputs.branch }}
      REPO_RELEASE_MODE: ${{ needs.plan.outputs.mode }}
      REPO_RELEASE_PACKAGE: ${{ inputs.package }}
      REPO_RELEASE_VERSION: ${{ inputs.version }}
    steps:
      - name: Checkout Repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.plan.outputs.ref }}
          fetch-depth: 0
          token: ${{ secrets.REPOCTL_RELEASE_TOKEN || secrets.CHANGESETS_RELEASE_TOKEN || github.token }}

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - name: Setup Node.js environment
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Download native artifacts from this run
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: native-*
          merge-multiple: true
          path: packages

      - name: Stage and verify all native platform packages
        run: pnpm native:artifacts:stage

      - name: Plan release
        run: node scripts/ci/release-stage.mjs plan

      - name: Install Playwright Chromium
        run: |
          for attempt in 1 2 3 4; do
            if pnpm exec playwright install chromium chromium-headless-shell; then
              exit 0
            fi
            echo "Playwright Chromium install failed, retrying (${attempt}/4)"
            sleep $((attempt * 10))
          done
          pnpm exec playwright install chromium chromium-headless-shell

      - name: Download same-commit coverage certificate
        if: inputs.mode == 'publish' || inputs.mode == 'publish-unpublished'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_CERTIFICATE_RUN_ID: ${{ vars.RELEASE_CERTIFICATE_RUN_ID }}
        run: |
          run_id="$RELEASE_CERTIFICATE_RUN_ID"
          test -n "$run_id" || {
            echo "Release certificate is not configured. Set RELEASE_CERTIFICATE_RUN_ID to a completed run that uploaded the signed certificate artifact for this commit." >&2
            exit 1
          }
          run_metadata="$(gh run view "$run_id" --json headSha,status,conclusion)"
          run_head_sha="$(jq -r '.headSha' <<<"$run_metadata")"
          run_status="$(jq -r '.status' <<<"$run_metadata")"
          run_conclusion="$(jq -r '.conclusion' <<<"$run_metadata")"
          test "$run_head_sha" = "$GITHUB_SHA" || {
            echo "Release certificate run $run_id belongs to $run_head_sha, expected $GITHUB_SHA" >&2
            exit 1
          }
          test "$run_status" = completed && test "$run_conclusion" = success || {
            echo "Release certificate run $run_id is not a successful completed run (status=$run_status conclusion=$run_conclusion)" >&2
            exit 1
          }
          certificate_name="coverage-certificate-$GITHUB_SHA"
          certificate_artifact="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run_id/artifacts" --paginate --jq '.artifacts[] | select(.expired == false) | .name' | grep -Fx "$certificate_name" || true)"
          test "$certificate_artifact" = "$certificate_name" || {
            echo "Run $run_id did not upload the required $certificate_name artifact" >&2
            exit 1
          }
          rm -rf e2e/.artifacts/release-certificate
          mkdir -p e2e/.artifacts/release-certificate
          gh run download "$run_id" --name "$certificate_name" --dir e2e/.artifacts/release-certificate

      - name: Validate release certificate
        if: inputs.mode == 'publish' || inputs.mode == 'publish-unpublished'
        shell: bash
        run: |
          report="$(find e2e/.artifacts/release-certificate -type f \( -name 'nightly-report.json' -o -name 'pr-report.json' -o -name 'coverage-report.json' \) -print -quit)"
          test -n "$report" || { echo "Coverage report is missing from certificate artifact" >&2; exit 1; }
          pnpm e2e:coverage:release-gate --report "$report"

      - name: Verify release
        run: node scripts/ci/release-stage.mjs verify

      - name: Require latest main before automatic prepare
        if: github.event_name == 'push'
        run: node scripts/ci/auto-prepare-plan.mjs --assert-current-main

      - name: Prepare release
        id: prepare
        run: node scripts/ci/release-stage.mjs prepare

      - name: Upload npm packages
        if: steps.prepare.outputs.publish == 'true'
        run: node scripts/ci/release-stage.mjs upload

      - name: Confirm public npm registry
        if: steps.prepare.outputs.publish == 'true'
        run: node scripts/ci/release-stage.mjs confirm

      - name: Finalize release metadata
        if: steps.prepare.outputs.publish == 'true'
        run: node scripts/ci/release-stage.mjs finalize

      - name: Upload release progress
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: release-progress-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            repoctl-ci-progress.json
            repoctl-publish-progress.json
            repoctl-release-progress.json
            pnpm-publish-summary.json
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@v5
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  oidc-audit:
    name: Audit npm OIDC
    if: inputs.oidc_audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Audit npm OIDC
        run: pnpm exec repo release ci --mode oidc-audit
