name: PR 1330 iOS memory evidence
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  ios:
    name: Expo iOS 18.5
    runs-on: macos-15-intel
    timeout-minutes: 50
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          check-latest: true
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Verify selected Xcode
        run: xcodebuild -version
      - name: Verify CoreSimulator toolchain contract
        run: |
          xcodebuild -checkFirstLaunchStatus
          simctl_path="$(xcrun --find simctl)"
          echo "simctl=$simctl_path"
          test "$simctl_path" = "$DEVELOPER_DIR/usr/bin/simctl"
          component_version="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' /Library/Developer/PrivateFrameworks/CoreSimulator.framework/Versions/A/Resources/Info.plist)"
          echo "CoreSimulator=$component_version"
          test "$component_version" = "1051.17.8"
      - name: Verify preinstalled CocoaPods
        run: pod --version
      - run: pnpm install --frozen-lockfile
      - name: Verify iOS launch reconciliation
        run: pnpm exec vitest run -c e2e/vitest.e2e.config.ts e2e/react-native-ios-launch.test.ts e2e/react-native-ios-build.test.ts e2e/react-native-ios-runtime.test.ts e2e/react-native-ios-screenshot.test.ts e2e/react-native-ios-screenshot-streams.test.ts e2e/react-native-ios-host-resources.test.ts e2e/react-native-ios-screenshot-sample.test.ts e2e/react-native-ios-screenshot-sample-lifecycle.test.ts e2e/react-native-native-wait.test.ts e2e/react-native-runtime-artifacts.test.ts e2e/react-native-artifact-evidence.test.ts e2e/react-native-reporter-session.test.ts e2e/react-native-important-evidence.test.ts e2e/react-native-static-entry-scope.test.ts e2e/react-native-phase-evidence.test.ts e2e/react-native-phase-capture.test.ts --update=none
      - run: pnpm turbo run build --filter=@weapp-tailwindcss/react-native...
      - name: Boot iOS simulator
        run: |
          udid="$(xcrun simctl create ReactNativeCompatibility 'iPhone 16 Pro' 'com.apple.CoreSimulator.SimRuntime.iOS-18-5')"
          echo "RN_IOS_DEVICE_ID=$udid" >> "$GITHUB_ENV"
          xcrun simctl boot "$udid"
          xcrun simctl bootstatus "$udid" -b
      - name: Run Expo iOS compatibility
        env:
          RN_IOS_HOST: 127.0.0.1
        shell: bash
        run: |
          node <<'JS'
          const { spawn } = require('node:child_process')
          const { appendFile } = require('node:fs/promises')
          const path = require('node:path')
          const destination = path.join(process.env.RUNNER_TEMP, 'pr1330-memory.ndjson')
          const controller = new AbortController()
          const queries = [
            ['swap', '/usr/sbin/sysctl', ['vm.swapusage']],
            ['pages', '/usr/bin/vm_stat', []],
            ['pressure', '/usr/bin/memory_pressure', ['-Q']],
          ]
          async function query(file, args, signal) {
            return new Promise((resolve) => {
              const child = spawn(file, args, { signal, killSignal: 'SIGKILL', timeout: 5000 })
              let stdout = ''
              let stderr = ''
              child.stdout.on('data', data => { stdout = (stdout + data).slice(-65536) })
              child.stderr.on('data', data => { stderr = (stderr + data).slice(-65536) })
              child.once('error', error => resolve({ error: String(error), stdout, stderr }))
              child.once('close', (code, exitSignal) => resolve({ code, signal: exitSignal, stdout, stderr }))
            })
          }
          async function snapshot(signal) {
            const at = new Date().toISOString()
            const results = await Promise.all(queries.map(async ([name, file, args]) => [name, await query(file, args, signal)]))
            await appendFile(destination, JSON.stringify({ at, completedAt: new Date().toISOString(), ...Object.fromEntries(results) }) + '\n')
          }
          async function main() {
            await snapshot(controller.signal)
            let pending
            const timer = setInterval(() => {
              if (!pending) {
                pending = snapshot(controller.signal).catch(error => process.stderr.write(String(error) + '\n')).finally(() => { pending = undefined })
              }
            }, 15000)
            const child = spawn('pnpm', ['e2e:react-native:ios'], { stdio: 'inherit' })
            const stop = () => {
              clearInterval(timer)
              controller.abort()
              child.kill('SIGTERM')
            }
            process.once('SIGTERM', stop)
            process.once('SIGINT', stop)
            try {
              const result = await new Promise((resolve, reject) => {
                child.once('error', reject)
                child.once('exit', (code, signal) => resolve({ code, signal }))
              })
              process.exitCode = result.code === null ? 1 : result.code
            }
            finally {
              clearInterval(timer)
              controller.abort()
              await pending
              await snapshot(new AbortController().signal)
              process.off('SIGTERM', stop)
              process.off('SIGINT', stop)
            }
          }
          main().catch(error => { process.stderr.write(String(error) + '\n'); process.exitCode = 1 })
          JS
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: react-native-ios-${{ github.run_id }}
          path: |
            e2e/.artifacts/react-native-ios/**
            ${{ runner.temp }}/pr1330-memory.ndjson
          if-no-files-found: warn
          include-hidden-files: true
          retention-days: 14
