name: React Native Compatibility

on:
  pull_request:
    types: [opened, synchronize]
    paths:
      - 'packages/react-native/**'
      - 'packages/engine/**'
      - 'packages/postcss/**'
      - 'packages/weapp-tailwindcss/src/generator/**'
      - 'examples/react-native-expo/**'
      - 'e2e/react-native/**'
      - 'e2e/react-native-*.test.ts'
      - 'e2e/playwright-image*.test.ts'
      - scripts/ci/verify-playwright-image.mjs
      - .github/actions/setup-process-tools/action.yml
      - 'tools/tailwindcss-test-catalog/**'
      - 'e2e/tailwind-capabilities/**'
      - package.json
      - pnpm-lock.yaml
      - .github/workflows/react-native-compatibility.yml
  workflow_dispatch:
  workflow_call:
    inputs:
      full_verification:
        description: 审批后完整执行版本 PR 验收，默认保留自动范围
        type: boolean
        required: false
        default: false

concurrency:
  group: react-native-${{ inputs.full_verification && format('full-{0}', github.run_id) || github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  scope:
    uses: ./.github/workflows/ci-scope.yml
    with:
      full_verification: ${{ inputs.full_verification || false }}

  web:
    needs: scope
    if: needs.scope.outputs.core == 'true'
    name: Expo Web compatibility (${{ matrix.browser }})
    runs-on: ubuntu-latest
    timeout-minutes: 25
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble@sha256:47b510dd9230bf0b9bfc9b20102241e577ea7a99334ab4c3ca19f19770e9b8ea
      options: --init --ipc=host
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    env:
      HOME: /root
      RN_WEB_BROWSER: ${{ matrix.browser }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.full_verification && github.event.pull_request.head.sha || github.sha }}
      - name: Trust container workspace
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm turbo run build --filter=@weapp-tailwindcss/react-native...
      - run: pnpm --filter @weapp-tailwindcss/react-native typecheck
      - run: pnpm --filter @weapp-tailwindcss/react-native test --update=none
      - uses: ./.github/actions/setup-process-tools
        timeout-minutes: 2
      - name: Verify preinstalled Playwright browser
        run: node scripts/ci/verify-playwright-image.mjs ${{ matrix.browser }}
      - run: pnpm exec vitest run -c e2e/vitest.e2e.config.ts e2e/react-native-ci.test.ts --update=none
      - run: pnpm e2e:react-native-compatibility
      - run: pnpm e2e:react-native:web
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: react-native-web-${{ matrix.browser }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: e2e/.artifacts/react-native-web-${{ matrix.browser }}/**
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 14

  android:
    needs: [scope, web]
    if: always() && !cancelled() && needs.scope.result == 'success' && needs.scope.outputs.core == 'true'
    name: Expo Android 11 / API 30
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.full_verification && github.event.pull_request.head.sha || github.sha }}
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - run: pnpm install --frozen-lockfile
      - run: pnpm turbo run build --filter=@weapp-tailwindcss/react-native...
      - name: Build Android debug APK
        run: |
          pnpm --filter @weapp-tailwindcss/example-react-native-expo exec expo prebuild --platform android --no-install
          cd examples/react-native-expo/android
          ./gradlew app:assembleDebug -PreactNativeArchitectures=x86_64
      - name: Enable hardware acceleration for the current runner
        shell: bash
        run: |
          sudo setfacl -m "u:$(id -un):rw" /dev/kvm
          test -r /dev/kvm && test -w /dev/kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          disable-linux-hw-accel: false
          pre-emulator-launch-script: '"$ANDROID_HOME/emulator/emulator" -accel-check'
          api-level: 30
          arch: x86_64
          profile: pixel_2
          cores: 2
          ram-size: 4096M
          heap-size: 512M
          disable-animations: true
          disable-spellchecker: true
          script: RN_ANDROID_DEVICE_ID=emulator-5554 RN_ANDROID_BINARY=examples/react-native-expo/android/app/build/outputs/apk/debug/app-debug.apk pnpm e2e:react-native:android
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: react-native-android-${{ github.run_id }}
          path: e2e/.artifacts/react-native-android/**
          if-no-files-found: warn
          include-hidden-files: true
          retention-days: 14

  ios:
    needs: scope
    if: needs.scope.outputs.core == 'true'
    name: Expo iOS 18.5
    runs-on: macos-15
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.full_verification && github.event.pull_request.head.sha || github.sha }}
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: brew install cocoapods
      - run: pnpm install --frozen-lockfile
      - name: Verify iOS launch reconciliation
        run: pnpm exec vitest run -c e2e/vitest.e2e.config.ts e2e/react-native-ios-launch.test.ts e2e/react-native-ios-build.test.ts e2e/react-native-ios-runtime.test.ts e2e/react-native-ios-screenshot.test.ts e2e/react-native-ios-screenshot-streams.test.ts e2e/react-native-ios-host-resources.test.ts e2e/react-native-ios-screenshot-sample.test.ts e2e/react-native-ios-screenshot-sample-lifecycle.test.ts e2e/react-native-native-wait.test.ts e2e/react-native-runtime-artifacts.test.ts e2e/react-native-artifact-evidence.test.ts e2e/react-native-reporter-session.test.ts e2e/react-native-important-evidence.test.ts e2e/react-native-static-entry-scope.test.ts e2e/react-native-phase-evidence.test.ts e2e/react-native-phase-capture.test.ts --update=none
      - run: pnpm turbo run build --filter=@weapp-tailwindcss/react-native...
      - name: Boot iOS simulator
        run: |
          udid="$(xcrun simctl create ReactNativeCompatibility 'iPhone 16 Pro' 'com.apple.CoreSimulator.SimRuntime.iOS-18-5')"
          echo "RN_IOS_DEVICE_ID=$udid" >> "$GITHUB_ENV"
          xcrun simctl boot "$udid"
          xcrun simctl bootstatus "$udid" -b
      - name: Run Expo iOS compatibility
        env:
          RN_IOS_HOST: 127.0.0.1
        run: pnpm e2e:react-native:ios
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: react-native-ios-${{ github.run_id }}
          path: e2e/.artifacts/react-native-ios/**
          if-no-files-found: warn
          include-hidden-files: true
          retention-days: 14
