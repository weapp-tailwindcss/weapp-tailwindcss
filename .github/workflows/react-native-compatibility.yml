name: PR 1330 selected Xcode component evidence
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: macos-15-intel
    timeout-minutes: 15
    env:
      DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer
    steps:
      - name: Capture all installed Xcode shims and versions
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/xcode-components"
          shopt -s nullglob
          for app in /Applications/Xcode*.app; do
            name="$(basename "$app")"
            bin="$app/Contents/Developer/usr/bin"
            if test -x "$bin/xcodebuild"; then
              "$bin/xcodebuild" -version > "$RUNNER_TEMP/xcode-components/$name.version.txt"
              file "$bin/simctl" > "$RUNNER_TEMP/xcode-components/$name.simctl-file.txt"
              shasum -a 256 "$bin/simctl" > "$RUNNER_TEMP/xcode-components/$name.simctl-sha256.txt"
              if test "$(head -c 2 "$bin/simctl")" = '#!'; then
                cp "$bin/simctl" "$RUNNER_TEMP/xcode-components/$name.simctl-shim.txt"
              fi
            fi
          done
          /usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' /Library/Developer/PrivateFrameworks/CoreSimulator.framework/Versions/A/Resources/Info.plist > "$RUNNER_TEMP/xcode-components/component-version.txt"
          xcrun simctl list runtimes --json > "$RUNNER_TEMP/xcode-components/runtimes.json"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: pr1330-xcode-components-${{ github.run_id }}
          path: ${{ runner.temp }}/xcode-components/**
          if-no-files-found: error
