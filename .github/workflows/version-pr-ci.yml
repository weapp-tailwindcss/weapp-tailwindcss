name: Version PR CI

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  actions: read
  pull-requests: read

concurrency:
  group: version-pr-ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  validate:
    name: Bind current version PR
    if: github.event.pull_request.head.ref == 'release/pnpm-version' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.base.ref == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      number: ${{ steps.target.outputs.number }}
      head: ${{ steps.target.outputs.head }}
      base: ${{ steps.target.outputs.base }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - name: Install version metadata parsers
        env:
          HUSKY: '0'
        run: pnpm --filter @weapp-tailwindcss/ci-scope install --prod --frozen-lockfile --ignore-scripts
      - name: Validate current version PR and exact head
        id: target
        env:
          GH_TOKEN: ${{ github.token }}
          CI_SCOPE_DEPENDENCY_ROOT: tools/ci-scope
        run: node scripts/ci/version-pr-route.mjs --github-output "$GITHUB_OUTPUT"

  approve:
    name: Approve version PR CI
    needs: validate
    environment:
      name: version-pr-ci
      deployment: false
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - name: Install version metadata parsers
        env:
          HUSKY: '0'
        run: pnpm --filter @weapp-tailwindcss/ci-scope install --prod --frozen-lockfile --ignore-scripts
      - name: Confirm the approved PR still belongs to this head
        env:
          GH_TOKEN: ${{ github.token }}
          CI_SCOPE_DEPENDENCY_ROOT: tools/ci-scope
        run: node scripts/ci/version-pr-route.mjs --check-current

  pr-checks:
    needs: approve
    uses: ./.github/workflows/pr-gate.yml
    with:
      full_verification: true
    secrets: inherit

  release-checks:
    needs: approve
    uses: ./.github/workflows/release-gate.yml
    with:
      full_verification: true

  seo-checks:
    needs: approve
    uses: ./.github/workflows/website-seo-quality.yml
    with:
      full_verification: true
    secrets: inherit

  readme-checks:
    needs: approve
    uses: ./.github/workflows/package-readme-quality.yml
    with:
      full_verification: true

  architecture-checks:
    needs: approve
    uses: ./.github/workflows/architecture.yml
    with:
      full_verification: true

  agent-checks:
    needs: approve
    uses: ./.github/workflows/agents.yml
    with:
      full_verification: true

  ci-checks:
    needs: approve
    uses: ./.github/workflows/ci.yml
    with:
      full_verification: true
    secrets: inherit

  benchmark-checks:
    needs: approve
    uses: ./.github/workflows/benchmark.yml
    with:
      full_verification: true
    secrets: inherit

  rn-checks:
    needs: approve
    uses: ./.github/workflows/react-native-compatibility.yml
    with:
      full_verification: true

  lynx-checks:
    needs: approve
    uses: ./.github/workflows/lynx-native.yml
    with:
      full_verification: true

  pr-gate:
    name: ${{ github.event.pull_request.head.ref == 'release/pnpm-version' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.base.ref == 'main' && 'PR Gate' || 'Version PR not applicable' }}
    if: always() && !cancelled() && github.event.pull_request.head.ref == 'release/pnpm-version' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.base.ref == 'main'
    needs: [validate, approve, pr-checks, release-checks, seo-checks, readme-checks, architecture-checks, agent-checks, ci-checks, benchmark-checks, rn-checks, lynx-checks]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every version verification result
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: node -e 'const results=JSON.parse(process.env.NEEDS_JSON); for (const [name, job] of Object.entries(results)) { if (job.result !== "success") { throw new Error(name + " result=" + job.result) } }'
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Confirm all results still belong to this head
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/ci/version-pr-route.mjs --check-current

  seo-gate:
    name: ${{ github.event.pull_request.head.ref == 'release/pnpm-version' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.base.ref == 'main' && 'SEO Quality Gate' || 'Version PR not applicable' }}
    if: always() && !cancelled() && github.event.pull_request.head.ref == 'release/pnpm-version' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.base.ref == 'main'
    needs: [validate, approve, pr-gate]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require full approved verification
        env:
          VALIDATE_RESULT: ${{ needs.validate.result }}
          APPROVAL_RESULT: ${{ needs.approve.result }}
          PR_GATE_RESULT: ${{ needs.pr-gate.result }}
        run: test "$VALIDATE_RESULT" = success && test "$APPROVAL_RESULT" = success && test "$PR_GATE_RESULT" = success
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Confirm the PR still belongs to this head
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/ci/version-pr-route.mjs --check-current
