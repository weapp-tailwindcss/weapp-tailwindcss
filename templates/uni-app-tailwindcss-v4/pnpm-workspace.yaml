packages:
  - .
catalogs:
  tailwindcss4:
    tailwindcss: ^4.3.5
  weappTailwindcss:
    weapp-tailwindcss: ^5.7.7
allowBuilds:
  core-js: false
  core-js-pure: false
  esbuild: true
  sharp: true
minimumReleaseAge: 0
minimumReleaseAgeExclude:
  - '@weapp-tailwindcss/*'
  - weapp-vite
  - wevu
  - '@weapp-vite/*'
  - '@weapp-core/*'
  - '@wevu/*'
  - repoctl
  - '@weapp-tailwindcss/postcss@4.0.7'
  - weapp-tailwindcss@5.7.7

patchedDependencies:
  webpack-virtual-modules@0.6.2: patches/webpack-virtual-modules@0.6.2.patch
