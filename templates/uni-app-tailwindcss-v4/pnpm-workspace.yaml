packages:
  - .
allowBuilds:
  core-js: false
  core-js-pure: false
  esbuild: true
  sharp: true
minimumReleaseAge: 0
minimumReleaseAgeExclude:
  - '@weapp-tailwindcss/*'
  - weapp-vite
  - wevu
  - '@weapp-vite/*'
  - '@weapp-core/*'
  - '@wevu/*'
  - repoctl
  - '@weapp-tailwindcss/postcss@3.3.3'
  - weapp-tailwindcss@5.5.5

patchedDependencies:
  webpack-virtual-modules@0.6.2: patches/webpack-virtual-modules@0.6.2.patch
  "@weapp-tailwindcss/postcss@3.4.3": patches/@weapp-tailwindcss__postcss@3.4.3.patch
