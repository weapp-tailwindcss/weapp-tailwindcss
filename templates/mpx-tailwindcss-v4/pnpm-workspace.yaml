packages:
  - .

catalogs:
  babelPresetEnv:
    '@babel/preset-env': ^7.29.14
  babelRuntimeCorejs3:
    '@babel/runtime-corejs3': ^7.29.14
  tailwindcss4:
    tailwindcss: ^4.3.5
  weappTailwindcss:
    weapp-tailwindcss: ^5.7.4

allowBuilds:
  "core-js-pure": false
  sharp: true
  "vue-demi": false

minimumReleaseAge: 0
minimumReleaseAgeExclude:
  - '@weapp-tailwindcss/*'
  - weapp-vite
  - wevu
  - '@weapp-vite/*'
  - '@weapp-core/*'
  - '@wevu/*'
  - repoctl
  - '@weapp-tailwindcss/postcss@4.0.4'
  - weapp-tailwindcss@5.7.4
overrides:
  '@mpxjs/eslint-config-ts@1.0.10>@typescript-eslint/parser': 8.72.1
  '@mpxjs/eslint-config-ts@1.0.10>@typescript-eslint/eslint-plugin': 8.72.1

patchedDependencies:
  watchpack@2.6.3: patches/watchpack@2.6.3.patch
  webpack-virtual-modules@0.6.2: patches/webpack-virtual-modules@0.6.2.patch
  "@mpxjs/vue-cli-plugin-mpx@2.2.32": patches/@mpxjs__vue-cli-plugin-mpx@2.2.32.patch
  webpack@5.112.2: patches/webpack@5.112.2.patch
  '@mpxjs/webpack-plugin@2.11.1': patches/@mpxjs__webpack-plugin@2.11.1.patch
