packages:
  - .
packageExtensions:
  'weapp-vite@7.7.0':
    dependencies:
      '@devframes/agentic': 1.2.6
patchedDependencies:
  '@weapp-tailwindcss/postcss@3.4.3': patches/@weapp-tailwindcss__postcss@3.4.3.patch
allowBuilds:
  '@swc/core': true
  esbuild: true
minimumReleaseAge: 0
minimumReleaseAgeExclude:
  - weapp-tailwindcss@5.5.5
  - "@weapp-tailwindcss/postcss@3.3.3"
  - weapp-vite
  - wevu
  - "@weapp-vite/*"
  - "@weapp-core/*"
  - "@wevu/*"
