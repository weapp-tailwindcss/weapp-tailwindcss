packages:
  - .
allowBuilds:
  '@parcel/watcher': false
  core-js: false
  core-js-pure: false
  esbuild: true
  fsevents: false
  puppeteer: false
  sharp: true
minimumReleaseAge: 0
minimumReleaseAgeExclude:
  - '@weapp-tailwindcss/*'
  - weapp-vite
  - wevu
  - '@weapp-vite/*'
  - '@weapp-core/*'
  - '@wevu/*'
  - repoctl
  - '@weapp-tailwindcss/postcss@3.3.3'
  - weapp-tailwindcss@5.5.5
